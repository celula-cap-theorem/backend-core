# =============================================================
# Reverse proxy para la célula Cap Theorem
# Anti-DoS: limit_conn, limit_req, timeouts anti-Slowloris
# =============================================================

# Rate limiting zones
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
limit_req_zone $binary_remote_addr zone=req_per_ip:10m rate=30r/s;

# Slowloris protection: close idle connections fast
client_body_timeout 10s;
client_header_timeout 10s;
send_timeout 10s;
keepalive_timeout 30s;

# Buffer size limits
client_body_buffer_size 128k;
client_max_body_size 10m;
large_client_header_buffers 4 16k;

# --- Landing Page (Frontend) ---
server {
    listen 80;
    listen [::]:80;
    server_name cap-theorem.andrescortes.dev;

    # Redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cap-theorem.andrescortes.dev;

    ssl_certificate /etc/letsencrypt/live/cap-theorem.andrescortes.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cap-theorem.andrescortes.dev/privkey.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    # Rate limiting
    limit_conn conn_per_ip 10;
    limit_req zone=req_per_ip burst=20 nodelay;

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Anti-Slowloris
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
    }

    # Block access to /api directly through frontend domain
    location /api/ {
        deny all;
        return 404;
    }
}

# --- API (Backend) ---
server {
    listen 80;
    listen [::]:80;
    server_name api.cap-theorem.andrescortes.dev;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.cap-theorem.andrescortes.dev;

    ssl_certificate /etc/letsencrypt/live/api.cap-theorem.andrescortes.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.cap-theorem.andrescortes.dev/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;

    limit_conn conn_per_ip 20;
    limit_req zone=req_per_ip burst=50 nodelay;

    location / {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
    }
}

# --- Documentation ---
server {
    listen 80;
    listen [::]:80;
    server_name docs.cap-theorem.andrescortes.dev;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name docs.cap-theorem.andrescortes.dev;

    ssl_certificate /etc/letsencrypt/live/docs.cap-theorem.andrescortes.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.cap-theorem.andrescortes.dev/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    limit_conn conn_per_ip 10;
    limit_req zone=req_per_ip burst=20 nodelay;

    root /var/www/docs;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Default catch-all
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 444;
}
